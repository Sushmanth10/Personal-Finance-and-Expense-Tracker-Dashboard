<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance & Expense Tracker</title>
  <link rel="icon" href="./assets/src/img/Project_logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="./assets/CSS/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-wallet"></i> Personal Finance & Expense Tracker</h1>
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
        <i id="theme-icon" class="fas fa-moon"></i>
      </button>
    </header>

    <section class="stats-grid">
      <div class="stat-card">
        <h3>Total Balance</h3>
        <p id="total-balance">₹0.00</p>
      </div>
      <div class="stat-card income">
        <h3>Total Income</h3>
        <p id="total-income">₹0.00</p>
      </div>
      <div class="stat-card expense">
        <h3>Total Expenses</h3>
        <p id="total-expense">₹0.00</p>
      </div>
      <div class="stat-card">
        <h3>Transactions</h3>
        <p id="transaction-count">0</p>
      </div>
    </section>

    <div class="main-grid">
      <section class="card add-form">
        <h2>Add Transaction</h2>
        <div class="form-group">
          <label>Type</label>
          <div class="radio-group">
            <label><input type="radio" name="type" value="expense" checked /> Expense</label>
            <label><input type="radio" name="type" value="income" /> Income</label>
          </div>
        </div>

        <div class="form-group">
          <label for="description-input">Description</label>
          <input type="text" id="description-input" placeholder="e.g., Grocery shopping, Salary" />
        </div>

        <div class="form-group">
          <label for="amount-input">Amount</label>
          <input type="number" id="amount-input" placeholder="0.00" step="0.01" />
        </div>

        <div class="form-group">
          <label for="category-select">Category</label>
          <select id="category-select">
            <option value="Food">🍔 Food</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Bills">📋 Bills</option>
            <option value="Education">📚 Education</option>
            <option value="Transport">🏍️ Transport</option>
            <option value="Salary">💰 Salary</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button id="add-btn" class="btn-primary"><i class="fas fa-plus"></i> Add</button>
      </section>

      <section class="card chart-section">
        <h2>Expense Breakdown</h2>
        <div class="chart-wrapper">
          <canvas id="category-chart"></canvas>
        </div>
      </section>
    </div>

    <section class="card history-section">
      <div class="history-header">
        <h2>Transaction History</h2>
        <div class="controls">
          <select id="filter-category">
            <option value="all">All Categories</option>
            <option value="Food">🍔 Food</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Bills">📋 Bills</option>
            <option value="Education">📚 Education</option>
            <option value="Transport">🏍️ Transport</option>
            <option value="Salary">💰 Salary</option>
            <option value="Other">Other</option>
          </select>

          <select id="filter-type">
            <option value="all">All Types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>

          <button id="clear-all-btn" class="btn-danger">Clear All</button>
        </div>
      </div>

      <div id="expenses-list" class="expenses-list"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./assets/JS/script.js"></script>
</body>
</html>
