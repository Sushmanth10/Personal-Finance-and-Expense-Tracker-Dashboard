<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="src/Project_logo.png">
    <title>Its Personal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="first_div">
        <video id="video" src="src/financial.mp4" autoplay muted loop></video>
        <span
            style="position: relative;height: 100%; color: white;display: flex;align-items: center;text-indent: 40px;font-size: 40px;">Its
            Personal</span>
        <span id="username_span" style="position: absolute;top: 40%; color: white;
        right: 60px;transform: translateY(-50%);">username: <b>Guest</b> </span>
        <span id="email_span" style="position: absolute;top: 60%;color: white;right: 60px;z-index: 2;">
            guest@gmail.com
        </span>
    </div>
    <div class="Amount_div">
        <!-- <span style="height: 100%;display: flex;text-align: center;justify-content: flex-end; align-items: center;margin-left: auto;top: 50%;">sush</span> -->
        <div
            style="display: grid;margin-top: 30px;margin-bottom: 30px;height: 50px;width: 15%;place-items: center;border-radius: 30px;padding-top: 5px;background-color: rgb(0 0 0 / 5%);">
            <p style="margin: 0;font-weight: 700;font-size: 12px;">Total Balance</p>
            <p style="margin: 0;font-size: 22px;font-weight: 400;color: green;font-weight: 900;">0.00 </p>
        </div>
        <div
            style="display: grid;margin-top: 30px;margin-bottom: 30px;height: 50px;width: 15%;place-items: center;border-radius: 30px;padding-top: 5px;background-color: rgb(0 0 0 / 5%);">
            <p style="margin: 0;font-weight: 700;font-size: 12px;">Income</p>
            <p style="margin: 0;font-size: 22px;font-weight: 900;color: blue;">0.00 </p>
        </div>
        <div
            style="display: grid;margin-top: 30px;margin-bottom: 30px;height: 50px;width: 15%;place-items: center;border-radius: 30px;padding-top: 5px;background-color: rgb(0 0 0 / 5%);">
            <p style="margin: 0;font-weight: 700;font-size: 12px;">Expenses</p>
            <p style="margin: 0;font-size: 22px;font-weight: 900;color: red;">0.00</p>
        </div>
        <div
            style="display: grid;margin-top: 30px;margin-bottom: 30px;height: 50px;width: 15%;place-items: center;border-radius: 30px;padding-top: 5px;background-color: rgb(0 0 0 / 5%);">
            <p style="margin: 0;font-weight: 700;font-size: 12px;">Transactions</p>
            <p style="margin: 0;font-size: 22px;font-weight: 900;">0.00</p>
        </div>
    </div>
    <div class="AddTransaction">
        <p style="padding-bottom: 10px;font-weight: 600;"><i class="fa-solid fa-circle-plus" style="color: rgba(0, 0, 255, 0.556);"></i> Add Transaction</p>
        <div style="display: flex;gap: 10px;">
            <p>
                <span style="font-size: 12px;color: rgb(133, 131, 129);">DESCRIPTION</span><br>
                <input type="text" placeholder="e.g. Groceries" style="width: 185px;height: 29px;">
            </p>
            <p>
                <span style="font-size: 12px;color: rgb(133, 131, 129)">AMOUNT</span><br>
                <input type="number" style="width: 185px;height: 29px">
            </p>
            <p>
                <span style="font-size: 12px;color: rgb(133, 131, 129)">CATEGORIES</span><br>
                <select name="" id="" style="width: 185px;height: 32px;">
                    <option value="Food" >🍔 Food</option>
                    <option value="Transport" >🏍️ Transport</option>
                    <option value="Shopping" >🛍️ Shopping</option>
                    <option value="Bills" >📋 Bills</option>
                    <option value="Entertainment" >🎬 Entertainment</option>
                    <option value="Health" >🏥 Health</option>
                    <option value="Education" >📚 Education</option>
                    <option value="Salary" >💰 Salary</option>
                    <option value="Others">📌 Others</option>
                </select>
            </p>
            <p>
                <label for=""> </label><br>
                <input type="button" value="+ Add" style="color: white;background-color: blue;width: 60px;border-radius: 10px;border: transparent;height: 32px;font-size: 17px;">
            </p>
        </div>
        <p style="padding-top: 10px;display: flex;gap: 15px
        ;">
            <input type="radio">Expense
            <input type="radio"> Income
        </p>
    </div><br>
    <div class="SpendingByCategories">
        <p><i class="fa-solid fa-chart-pie"></i> spending by categories</p>

    </div>

  border: 2px solid green;

">
  <p style="margin-top: auto;">sushmanth</p>
</div> -->
</body>

</html>
